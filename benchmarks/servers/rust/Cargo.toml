[package]
name = "rae-server-references"
version = "0.1.0"
edition = "2021"
publish = false

# The Rust references of docs/server-benchmarks-design.md §4: hyper 1.x on
# tokio (F3), written the ordinary way, not tuned.
[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros"] }

[[bin]]
name = "http"
path = "src/bin/http.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
