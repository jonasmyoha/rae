[package]
name = "rae-server-references"
version = "0.1.0"
edition = "2021"
publish = false

# The Rust references of docs/server-benchmarks-design.md §4, tuned: hyper 1.x
# on tokio (F3) for HTTP; for WebSocket and the game room a WebSocket layer
# written directly on tokio's TcpStream (src/ws.rs: frames encoded once and
# written straight to the socket), with tungstenite only for the accept key.
# mimalloc is the allocator throughout.
[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
httparse = "1"
mimalloc = { version = "0.1", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-tungstenite = "0.28"

[[bin]]
name = "http"
path = "src/bin/http.rs"

[[bin]]
name = "webSocket"
path = "src/bin/webSocket.rs"

[[bin]]
name = "gameRoom"
path = "src/bin/gameRoom.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
