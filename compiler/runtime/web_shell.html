<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080c12">
  <link rel="icon" href="data:,">
  <title>Rae WebGPU</title>
  <style>
    :root { color-scheme: dark; background: #080c12; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; background: radial-gradient(circle at 50% 20%, #172234, #080c12 65%); }
    canvas { width: 100vw; height: 100vh; display: block; outline: none; background: #080c12; }
    #status { position: fixed; left: 18px; bottom: 14px; color: #aebbd0; font: 12px/1.4 ui-monospace, monospace; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading Rae WebGPU...</div>
  <script>
    const status = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus(text) {
        status.textContent = text;
        if (!text) status.remove();
      },
      printErr(text) {
        console.error(text);
        status.textContent = text;
      }
    };
  </script>

</body>
</html>
